[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # The Supabase URL and anon/publishable key are PUBLIC by design and get
  # inlined into the client bundle by Vite. Tell Netlify's secrets scanner to
  # ignore them so it doesn't fail the build. (Never add the service_role /
  # secret key or TOKEN_ENCRYPTION_KEY here — those must never reach the bundle.)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,SUPABASE_URL,SUPABASE_ANON_KEY"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = true

# SPA fallback: let React Router handle client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  # All functions are written in TypeScript and share the ./netlify/functions/_shared helpers.
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN (not DENY) so the app can embed /action-tracker/ in an in-app iframe.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
